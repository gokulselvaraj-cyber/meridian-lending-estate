name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  loan-core:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: loan-core}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: mvn -B package          # builds and runs the unit tests

  loan-portal:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: loan-portal}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm ci
      - run: npm run build
