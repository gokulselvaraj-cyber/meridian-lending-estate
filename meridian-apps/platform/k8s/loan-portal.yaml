apiVersion: apps/v1
kind: Deployment
metadata:
  name: loan-portal
  namespace: lending
  labels: {app: loan-portal, team: digital}
spec:
  replicas: 2
  selector:
    matchLabels: {app: loan-portal}
  template:
    metadata:
      labels: {app: loan-portal}
    spec:
      containers:
        - name: loan-portal
          image: europe-docker.pkg.dev/meridian/lending/loan-portal:2.8.0
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
          livenessProbe:
            httpGet: {path: /, port: 80}
---
apiVersion: v1
kind: Service
metadata:
  name: loan-portal
  namespace: lending
spec:
  selector: {app: loan-portal}
  ports: [{port: 80, targetPort: 80}]
